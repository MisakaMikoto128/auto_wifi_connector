[package]
name = "auto-wifi-connector"
version = "0.2.0"
description = "Automatically reconnects to a working WiFi network when internet access drops"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "auto_wifi_connector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
windows = { version = "0.62", features = ["Devices_Radios", "Foundation", "Foundation_Collections"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

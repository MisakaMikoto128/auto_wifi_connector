[package]
name = "auto-wifi-connector"
version = "0.5.0"
description = "Automatically reconnects to a working WiFi network when internet access drops"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "auto_wifi_connector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Radios", "Foundation", "Foundation_Collections", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSSet", "NSArray"] }
objc2-core-wlan = { version = "0.3", features = ["CWInterface", "CWNetwork", "CWChannel", "CoreWLANTypes"] }

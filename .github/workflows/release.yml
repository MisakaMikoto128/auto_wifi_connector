name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo build --release
        run: cargo build --release
        working-directory: src-tauri

      - name: 打包 zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/auto-wifi-connector.exe dist/
          Compress-Archive -Path dist/auto-wifi-connector.exe `
            -DestinationPath "dist/auto-wifi-connector-$tag-windows-x64.zip" -Force

      - name: 创建 Release 并上传 zip
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/auto-wifi-connector-${{ github.ref_name }}-windows-x64.zip

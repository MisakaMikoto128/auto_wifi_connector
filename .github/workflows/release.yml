name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo build --release
        run: cargo build --release
        working-directory: src-tauri

      - name: 打包 zip 并生成 SHA256 校验文件
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "auto-wifi-connector-$tag-windows-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/auto-wifi-connector.exe dist/
          Compress-Archive -Path dist/auto-wifi-connector.exe -DestinationPath "dist/$zip" -Force
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "dist/$zip.sha256"

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/auto-wifi-connector-${{ github.ref_name }}-windows-x64.zip
            dist/auto-wifi-connector-${{ github.ref_name }}-windows-x64.zip.sha256

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 软件内更新依赖 minisign 签名：缺密钥时提前失败并给出配置指引
      - name: 校验更新签名密钥
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::未配置 TAURI_SIGNING_PRIVATE_KEY secret（minisign 私钥），无法生成签名更新包。请在仓库 Settings → Secrets and variables → Actions 添加，配置方法见 README「发布」章节；配置后重新推送 tag。"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      # 各平台原生安装包：Windows NSIS / macOS app+dmg / Linux deb+rpm+AppImage
      # uploadUpdaterJson 生成 latest.json（软件内更新清单）随 Release 上传，
      # preferNsis 让 Windows 更新走 NSIS 安装包
      - name: 构建平台安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false

      # Windows 便携版 zip（无需安装，要求系统已有 WebView2）
      - name: 打包 Windows 便携 zip 与 SHA256
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "auto-wifi-connector-$tag-windows-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/auto-wifi-connector.exe" dist/
          Compress-Archive -Path dist/auto-wifi-connector.exe -DestinationPath "dist/$zip" -Force
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "dist/$zip.sha256"

      - name: 上传 Windows 便携包
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/auto-wifi-connector-${{ github.ref_name }}-windows-x64.zip
            dist/auto-wifi-connector-${{ github.ref_name }}-windows-x64.zip.sha256
